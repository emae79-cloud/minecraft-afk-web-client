<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Gelişmiş AFK Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0c20; color: #e2e8f0; margin: 0; padding: 20px; min-height: 100vh; }
    .container { max-width: 950px; margin: 0 auto; background: #170f26; padding: 25px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    /* Sekmeler */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .tab-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .tab-btn.active { background: #8b5cf6; color: #fff; border-color: #a78bfa; }
    .tab-btn .close-tab { opacity: 0.6; padding: 2px 6px; border-radius: 4px; }
    .tab-btn .close-tab:hover { opacity: 1; background: rgba(0,0,0,0.4); }
    .btn-add-tab { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px dashed #34d399; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    h2 { margin: 0; color: #a78bfa; font-size: 22px; }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .badge-online { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid #34d399; }
    .badge-offline { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; }
    .badge-connecting { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #fbbf24; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .status-monitor { display: flex; gap: 20px; background: rgba(0,0,0,0.3); padding: 12px 18px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; border: 1px solid rgba(255,255,255,0.05); }
    .stat-val { font-weight: bold; color: #38bdf8; }

    .config-panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; background: rgba(255,255,255,0.03); padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .field-title { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
    input[type="text"], input[type="password"], select { padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(15,12,32,0.8); color: #fff; font-size: 13px; outline: none; width: 100%; }
    input:focus, select:focus { border-color: #a78bfa; }
    
    .checkbox-group { grid-column: 1 / -1; display: flex; gap: 20px; flex-wrap: wrap; }
    label { font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    
    .btn-group { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 5px; }
    button { padding: 10px 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-connect { background: #8b5cf6; color: #fff; flex: 2; }
    .btn-connect:hover { background: #7c3aed; }
    .btn-stop { background: #ef4444; color: #fff; flex: 1; }
    .btn-stop:hover { background: #dc2626; }

    .quick-cmds { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
    .quick-title { font-size: 12px; color: #94a3b8; font-weight: 600; }
    .btn-cmd { background: rgba(255,255,255,0.08); color: #e2e8f0; padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    .btn-cmd:hover { background: #a78bfa; color: #fff; }
    .btn-login { background: #3b82f6; color: #fff; font-weight: 700; }
    .btn-skyblock { background: #10b981; color: #fff; font-weight: 700; }

    /* Sandık / GUI Arayüzü */
    .gui-box { background: rgba(0,0,0,0.8); border: 2px solid #a78bfa; border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; }
    .gui-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gui-title { font-weight: bold; color: #fbbf24; font-size: 15px; }
    .chest-grid { display: grid; grid-template-columns: repeat(9, minmax(34px, 42px)); gap: 4px; justify-content: center; background: #8b8b8b; padding: 8px; border-radius: 8px; border: 3px solid #373737; }
    .slot { width: 100%; aspect-ratio: 1; background: #c6c6c6; border: 2px solid #373737; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
    .slot:hover { background: #fff; border-color: #a78bfa; }
    .slot img { width: 26px; height: 26px; image-rendering: pixelated; pointer-events: none; }
    .slot-count { position: absolute; bottom: 1px; right: 3px; font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px #000; }

    .mc-tooltip { display: none; position: fixed; z-index: 9999; background: rgba(16,0,16,0.95); border: 2px solid #280068; border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 12px; pointer-events: none; max-width: 280px; }

    .chat-container { position: relative; }
    #chat-box { height: 300px; overflow-y: auto; background: #090613; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 12px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .chat-msg { margin-bottom: 4px; word-break: break-word; }
    .system-msg { color: #38bdf8; font-weight: 600; }
    .self-msg { color: #34d399; font-weight: 600; }

    /* Komut Önerileri */
    .input-wrapper { position: relative; display: flex; gap: 10px; }
    .suggestions-popup { position: absolute; bottom: 100%; left: 0; right: 100px; background: #170f26; border: 1px solid #a78bfa; border-radius: 8px; max-height: 150px; overflow-y: auto; z-index: 100; display: none; }
    .suggestion-item { padding: 10px 14px; font-size: 13px; color: #e2e8f0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); font-family: monospace; }
    .suggestion-item:hover, .suggestion-item.active { background: #8b5cf6; color: #fff; }

    .input-group-bot { display: flex; gap: 10px; flex: 1; }
    .input-group-bot input { flex: 1; }
    .btn-send { background: #a78bfa; color: #fff; padding: 0 24px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-send:hover { background: #7c3aed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tab-bar" id="tabBar"></div>

    <div class="header">
      <h2>🎮 Minecraft AFK Portal</h2>
      <div id="statusBadge" class="badge badge-offline">
        <span class="dot"></span> <span id="statusText">Çevrimdışı</span>
      </div>
    </div>

    <div class="status-monitor">
      <div>❤️ Can: <span id="statHealth" class="stat-val">-</span></div>
      <div>🍗 Açlık: <span id="statFood" class="stat-val">-</span></div>
      <div>📍 Konum: <span id="statPos" class="stat-val">- / - / -</span></div>
    </div>
    
    <div class="config-panel">
      <div class="input-field">
        <span class="field-title">Sunucu Adresi</span>
        <input type="text" id="host" value="play.mc4fun.net" onchange="updateActiveTabData()">
      </div>
      <div class="input-field">
        <span class="field-title">Port</span>
        <input type="text" id="port" value="25565" onchange="updateActiveTabData()">
      </div>
      <div class="input-field">
        <span class="field-title">Kullanıcı Adı (Bot)</span>
        <input type="text" id="username" placeholder="Örn: nusretyasir" onchange="updateActiveTabData()">
      </div>
      <div class="input-field">
        <span class="field-title">Şifre (/login)</span>
        <input type="password" id="password" placeholder="Şifreniz" onchange="updateActiveTabData()">
      </div>
      <div class="input-field">
        <span class="field-title">Komut Gecikmesi</span>
        <select id="cmdDelay" onchange="updateActiveTabData()">
          <option value="2000">2 Saniye</option>
          <option value="3000" selected>3 Saniye</option>
          <option value="5000">5 Saniye</option>
        </select>
      </div>
      
      <div class="checkbox-group">
        <label><input type="checkbox" id="autoSkyblock" onchange="updateActiveTabData()"> Otomatik Skyblock'a Geç (/skyblock)</label>
        <label><input type="checkbox" id="autoReconnect" checked onchange="updateActiveTabData()"> Otomatik Yeniden Bağlan</label>
      </div>

      <div class="btn-group">
        <button class="btn-connect" onclick="startBot()">⚡ Botu Başlat / Bağlan</button>
        <button class="btn-stop" onclick="stopBot()">🛑 Botu Durdur</button>
      </div>
    </div>

    <div class="quick-cmds">
      <span class="quick-title">Hızlı Komutlar:</span>
      <button class="btn-cmd btn-login" onclick="sendLogin()">🔑 /login</button>
      <button class="btn-cmd btn-skyblock" onclick="sendCmd('/skyblock')">🏝️ /skyblock</button>
      <button class="btn-cmd" onclick="sendCmd('/shard')">💎 /shard</button>
      <button class="btn-cmd" onclick="sendCmd('/farm')">🌾 /farm</button>
      <button class="btn-cmd" onclick="sendCmd('/is')">🏠 /is</button>
      <button class="btn-cmd" onclick="sendCmd('/afk')">💤 /afk</button>
      <button class="btn-cmd" onclick="sendCmd('/spawn')">📍 /spawn</button>
      <button class="btn-cmd" onclick="sendCmd('/ping')">📶 /ping</button>
    </div>

    <!-- Sandık / GUI Arayüzü -->
    <div id="guiBox" class="gui-box">
      <div class="gui-header">
        <span id="guiTitle" class="gui-title">Açılan Menü</span>
        <button style="background:#ef4444; color:#fff; padding:4px 10px; font-size:12px;" onclick="closeGui()">Kapat ✕</button>
      </div>
      <div id="chestGrid" class="chest-grid"></div>
    </div>

    <div class="chat-container">
      <div id="chat-box"></div>
    </div>

    <div class="input-wrapper">
      <div id="suggestionsPopup" class="suggestions-popup"></div>
      <input type="text" id="messageInput" placeholder="Mesaj veya komut yazın (örn: /is)..." autocomplete="off" oninput="handleInput()" onkeydown="handleKeyDown(event)">
      <button type="button" class="btn-send" onclick="sendMessage()">Gönder</button>
    </div>
  </div>

  <div id="mcTooltip" class="mc-tooltip"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const commonCommands = ['/login', '/register', '/skyblock', '/is', '/is home', '/is go', '/farm', '/shard', '/afk', '/spawn', '/ping', '/tpa', '/tpaccept', '/msg'];

    let botTabs = JSON.parse(localStorage.getItem('mc_afk_bots_v2')) || [
      { id: 1, host: 'play.mc4fun.net', port: '25565', username: 'nusretyasir', password: '', autoSkyblock: false, autoReconnect: true, cmdDelay: '3000' }
    ];
    let activeTabIndex = 0;
    let selectedSuggestionIndex = -1;

    function saveTabs() {
      localStorage.setItem('mc_afk_bots_v2', JSON.stringify(botTabs));
    }

    function renderTabs() {
      const bar = document.getElementById('tabBar');
      bar.innerHTML = '';
      botTabs.forEach((bot, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === activeTabIndex ? 'active' : ''}`;
        btn.innerHTML = `<span>🤖 ${bot.username || 'Bot ' + (index + 1)}</span> ${botTabs.length > 1 ? `<span class="close-tab" onclick="deleteTab(event, ${index})">✕</span>` : ''}`;
        btn.onclick = () => switchTab(index);
        bar.appendChild(btn);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'tab-btn btn-add-tab';
      addBtn.innerHTML = '+ Yeni Bot Sekmesi';
      addBtn.onclick = addNewTab;
      bar.appendChild(addBtn);
    }

    function switchTab(index) {
      activeTabIndex = index;
      loadFields();
      renderTabs();
      document.getElementById('chat-box').innerHTML = '';
      socket.emit('initData');
    }

    function addNewTab() {
      botTabs.push({ id: Date.now(), host: 'play.mc4fun.net', port: '25565', username: 'Bot' + (botTabs.length + 1), password: '', autoSkyblock: false, autoReconnect: true, cmdDelay: '3000' });
      saveTabs();
      switchTab(botTabs.length - 1);
    }

    function deleteTab(e, index) {
      e.stopPropagation();
      if (botTabs.length <= 1) return;
      socket.emit('stopBot', botTabs[index].username);
      botTabs.splice(index, 1);
      if (activeTabIndex >= botTabs.length) activeTabIndex = botTabs.length - 1;
      saveTabs();
      switchTab(activeTabIndex);
    }

    function loadFields() {
      const bot = botTabs[activeTabIndex];
      document.getElementById('host').value = bot.host || 'play.mc4fun.net';
      document.getElementById('port').value = bot.port || '25565';
      document.getElementById('username').value = bot.username || '';
      document.getElementById('password').value = bot.password || '';
      document.getElementById('autoSkyblock').checked = !!bot.autoSkyblock;
      document.getElementById('autoReconnect').checked = bot.autoReconnect !== false;
      document.getElementById('cmdDelay').value = bot.cmdDelay || '3000';
    }

    function updateActiveTabData() {
      const bot = botTabs[activeTabIndex];
      bot.host = document.getElementById('host').value;
      bot.port = document.getElementById('port').value;
      bot.username = document.getElementById('username').value.trim();
      bot.password = document.getElementById('password').value;
      bot.autoSkyblock = document.getElementById('autoSkyblock').checked;
      bot.autoReconnect = document.getElementById('autoReconnect').checked;
      bot.cmdDelay = document.getElementById('cmdDelay').value;
      saveTabs();
      renderTabs();
    }

    function getUsername() { return document.getElementById('username').value.trim(); }

    function startBot() {
      updateActiveTabData();
      const bot = botTabs[activeTabIndex];
      if (!bot.username) return alert('Lütfen bot ismi girin!');
      socket.emit('startBot', bot);
    }

    function stopBot() {
      const u = getUsername();
      if (u) socket.emit('stopBot', u);
    }

    function sendLogin() {
      const username = getUsername();
      const password = document.getElementById('password').value;
      socket.emit('sendLogin', { username, password });
    }

    function sendCmd(cmd) {
      const username = getUsername();
      if (username) socket.emit('sendMessage', { username, message: cmd });
    }

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      const username = getUsername();
      if (text !== '' && username) {
        socket.emit('sendMessage', { username, message: text });
        input.value = '';
        hideSuggestions();
      }
    }

    function handleInput() {
      const val = document.getElementById('messageInput').value;
      const popup = document.getElementById('suggestionsPopup');
      if (!val.startsWith('/')) { hideSuggestions(); return; }
      const matches = commonCommands.filter(c => c.toLowerCase().includes(val.toLowerCase()));
      if (matches.length > 0) {
        popup.innerHTML = '';
        matches.forEach((cmd, idx) => {
          const item = document.createElement('div');
          item.className = `suggestion-item ${idx === selectedSuggestionIndex ? 'active' : ''}`;
          item.innerText = cmd;
          item.onclick = () => { document.getElementById('messageInput').value = cmd; hideSuggestions(); };
          popup.appendChild(item);
        });
        popup.style.display = 'block';
      } else { hideSuggestions(); }
    }

    function hideSuggestions() { document.getElementById('suggestionsPopup').style.display = 'none'; selectedSuggestionIndex = -1; }

    function handleKeyDown(e) {
      const popup = document.getElementById('suggestionsPopup');
      const items = popup.getElementsByClassName('suggestion-item');
      if (popup.style.display === 'block' && items.length > 0) {
        if (e.key === 'ArrowDown') { e.preventDefault(); selectedSuggestionIndex = (selectedSuggestionIndex + 1) % items.length; updateHighlight(items); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); selectedSuggestionIndex = (selectedSuggestionIndex - 1 + items.length) % items.length; updateHighlight(items); return; }
        if (e.key === 'Enter' && selectedSuggestionIndex >= 0) { e.preventDefault(); document.getElementById('messageInput').value = items[selectedSuggestionIndex].innerText; hideSuggestions(); return; }
      }
      if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
    }

    function updateHighlight(items) {
      for (let i = 0; i < items.length; i++) items[i].classList.toggle('active', i === selectedSuggestionIndex);
    }

    socket.on('initData', (list) => {
      const u = getUsername();
      const data = list.find(b => b.username === u);
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      if (data) {
        setStatus(data.status);
        data.chatHistory.forEach(m => appendChat(m));
      } else { setStatus('offline'); }
    });

    socket.on('statusUpdate', (d) => { if (d.username === getUsername()) setStatus(d.status); });

    function setStatus(status) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      if (status === 'online') { badge.className = 'badge badge-online'; text.innerText = 'Çevrimiçi'; }
      else if (status === 'connecting') { badge.className = 'badge badge-connecting'; text.innerText = 'Bağlanılıyor...'; }
      else { 
        badge.className = 'badge badge-offline'; text.innerText = 'Çevrimdışı'; 
        document.getElementById('statHealth').innerText = '-';
        document.getElementById('statFood').innerText = '-';
        document.getElementById('statPos').innerText = '- / - / -';
        document.getElementById('guiBox').style.display = 'none';
      }
    }

    socket.on('statsUpdate', (d) => {
      if (d.username === getUsername()) {
        document.getElementById('statHealth').innerText = d.health + ' / 20';
        document.getElementById('statFood').innerText = d.food + ' / 20';
        document.getElementById('statPos').innerText = `${d.pos.x}, ${d.pos.y}, ${d.pos.z}`;
      }
    });

    socket.on('chatMessage', (msg) => { if (msg.username === getUsername()) appendChat(msg); });

    function appendChat(msg) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = 'chat-msg';
      if (msg.type === 'system') div.classList.add('system-msg');
      if (msg.type === 'self') div.classList.add('self-msg');
      div.textContent = `[${msg.time}] ${msg.text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    socket.on('openWindow', (gui) => {
      if (gui.username !== getUsername()) return;
      document.getElementById('guiTitle').innerText = gui.title;
      const grid = document.getElementById('chestGrid');
      grid.innerHTML = '';
      document.getElementById('guiBox').style.display = 'block';

      gui.slots.forEach((item) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        if (!item.empty && item.name) {
          slot.innerHTML = `<img src="https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/${item.name}.png" onerror="this.src='https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/${item.name}.png'">${item.count > 1 ? `<span class="slot-count">${item.count}</span>` : ''}`;
        }
        slot.onclick = () => socket.emit('clickSlot', { username: getUsername(), slotIndex: item.slot });
        grid.appendChild(slot);
      });
    });

    socket.on('closeWindow', (d) => { if (d.username === getUsername()) document.getElementById('guiBox').style.display = 'none'; });
    function closeGui() { document.getElementById('guiBox').style.display = 'none'; socket.emit('closeCurrentWindow', getUsername()); }

    window.onload = () => { renderTabs(); loadFields(); };
  </script>
</body>
</html>
