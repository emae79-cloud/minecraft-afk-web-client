<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Gelişmiş AFK Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0f0c20; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: #170f26; padding: 25px; border-radius: 12px; border: 1px solid #332; }
    
    /* Sekmeler */
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
    .tab { background: #2d244a; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .tab.active { background: #8b5cf6; }
    .tab-add { background: #10b981; }

    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-left: 10px; }
    .online { background: #059669; color: #fff; }
    .offline { background: #dc2626; color: #fff; }
    .connecting { background: #d97706; color: #fff; }

    /* Ayarlar */
    .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; background: #1e1435; padding: 15px; border-radius: 8px; }
    .input-group label { display: block; font-size: 12px; color: #a78bfa; margin-bottom: 5px; }
    input, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4c1d95; background: #0f0c20; color: #fff; }
    .btn-row { grid-column: 1 / -1; display: flex; gap: 10px; }
    button.action-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
    .btn-start { background: #8b5cf6; } .btn-stop { background: #ef4444; }

    /* Sohbet ve Komut Tamamlama */
    .chat-box { height: 350px; overflow-y: auto; background: #090613; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 13px; margin-bottom: 10px; border: 1px solid #332; }
    .chat-msg { margin-bottom: 4px; word-wrap: break-word; }
    .msg-system { color: #f59e0b; } .msg-self { color: #34d399; }
    
    .chat-input-wrapper { position: relative; display: flex; gap: 10px; }
    #chatInput { flex: 1; }
    .btn-send { background: #3b82f6; padding: 0 20px; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: bold; }
    
    /* Komut Önerme Menüsü */
    .autocomplete-items { position: absolute; bottom: 100%; left: 0; right: 80px; background: #1e1435; border: 1px solid #4c1d95; border-radius: 6px; z-index: 99; display: none; max-height: 150px; overflow-y: auto; }
    .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #2d244a; }
    .autocomplete-items div:hover { background: #8b5cf6; }

    /* İstatistikler */
    .stats { display: flex; gap: 15px; margin-bottom: 15px; font-size: 13px; color: #94a3b8; }
    .stats span { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="tabs" id="tabContainer">
      <button class="tab tab-add" onclick="addNewBot()">+ Yeni Bot Ekle</button>
    </div>

    <div class="stats">
      Durum: <span id="uiStatus" class="status-badge offline">Çevrimdışı</span>
      Can: <span id="uiHealth">-</span>
      Açlık: <span id="uiFood">-</span>
      Konum: <span id="uiPos">-</span>
    </div>

    <div class="config-grid">
      <div class="input-group">
        <label>Sunucu IP</label>
        <input type="text" id="cfgHost" value="play.mc4fun.net" onchange="saveData()">
      </div>
      <div class="input-group">
        <label>Port</label>
        <input type="text" id="cfgPort" value="25565" onchange="saveData()">
      </div>
      <div class="input-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="cfgUsername" placeholder="Bot İsmi" onchange="updateTabName()">
      </div>
      <div class="input-group">
        <label>Şifre (/login)</label>
        <input type="password" id="cfgPassword" onchange="saveData()">
      </div>
      <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" id="cfgAutoSkyblock" style="width: auto;" onchange="saveData()">
        <label style="margin:0;">Oto /skyblock</label>
      </div>
      <div class="btn-row">
        <button class="action-btn btn-start" onclick="startCurrentBot()">▶ Botu Başlat</button>
        <button class="action-btn btn-stop" onclick="stopCurrentBot()">⏹ Durdur</button>
        <button class="action-btn btn-start" style="background:#2563eb;" onclick="loginCurrentBot()">🔑 Giriş Yap (/login)</button>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="chat-input-wrapper">
      <div id="autocompleteList" class="autocomplete-items"></div>
      <input type="text" id="chatInput" placeholder="Mesaj veya komut yazın (örn: /is)" onkeyup="handleChatInput(event)">
      <button class="btn-send" onclick="sendChat()">Gönder</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let botsData = JSON.parse(localStorage.getItem('mcBotsData')) || [{ id: 1, name: 'Bot 1', host: 'play.mc4fun.net', port: '25565', username: '', password: '', autoSky: true }];
    let activeBotIndex = 0;
    
    // Önerilecek komutlar listesi
    const commandList = ['/login', '/skyblock', '/is', '/is go', '/farm', '/shard', '/afk', '/spawn', '/ping', '/tpa', '/tpaccept', '/msg'];

    function saveData() {
      const active = botsData[activeBotIndex];
      active.host = document.getElementById('cfgHost').value;
      active.port = document.getElementById('cfgPort').value;
      active.username = document.getElementById('cfgUsername').value;
      active.password = document.getElementById('cfgPassword').value;
      active.autoSky = document.getElementById('cfgAutoSkyblock').checked;
      localStorage.setItem('mcBotsData', JSON.stringify(botsData));
    }

    function renderTabs() {
      const container = document.getElementById('tabContainer');
      container.innerHTML = '';
      botsData.forEach((bot, index) => {
        const btn = document.createElement('button');
        btn.className = `tab ${index === activeBotIndex ? 'active' : ''}`;
        btn.innerText = bot.username || bot.name;
        btn.onclick = () => switchTab(index);
        container.appendChild(btn);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'tab tab-add';
      addBtn.innerText = '+ Yeni Sekme';
      addBtn.onclick = addNewBot;
      container.appendChild(addBtn);
    }

    function switchTab(index) {
      activeBotIndex = index;
      const bot = botsData[index];
      document.getElementById('cfgHost').value = bot.host || 'play.mc4fun.net';
      document.getElementById('cfgPort').value = bot.port || '25565';
      document.getElementById('cfgUsername').value = bot.username || '';
      document.getElementById('cfgPassword').value = bot.password || '';
      document.getElementById('cfgAutoSkyblock').checked = bot.autoSky || false;
      document.getElementById('chatBox').innerHTML = ''; // Temizle
      renderTabs();
    }

    function updateTabName() {
      botsData[activeBotIndex].name = document.getElementById('cfgUsername').value || `Bot ${activeBotIndex + 1}`;
      saveData();
      renderTabs();
    }

    function addNewBot() {
      botsData.push({ id: Date.now(), name: `Bot ${botsData.length + 1}`, host: 'play.mc4fun.net', port: '25565', username: '', password: '', autoSky: false });
      saveData();
      switchTab(botsData.length - 1);
    }

    function getActiveUsername() {
      return document.getElementById('cfgUsername').value.trim();
    }

    function startCurrentBot() {
      saveData();
      const bot = botsData[activeBotIndex];
      if(!bot.username) return alert("Kullanıcı adı girin!");
      socket.emit('startBot', { host: bot.host, port: bot.port, username: bot.username, password: bot.password, autoSkyblock: bot.autoSky, autoReconnect: true });
    }

    function stopCurrentBot() {
      const user = getActiveUsername();
      if(user) socket.emit('stopBot', user);
    }

    function loginCurrentBot() {
      const user = getActiveUsername();
      const pwd = document.getElementById('cfgPassword').value;
      if(user && pwd) socket.emit('sendLogin', { username: user, password: pwd });
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const user = getActiveUsername();
      if(user && input.value.trim() !== '') {
        socket.emit('sendMessage', { username: user, message: input.value });
        input.value = '';
        document.getElementById('autocompleteList').style.display = 'none';
      }
    }

    // Komut Tamamlama Mantığı
    function handleChatInput(e) {
      if(e.key === 'Enter') return sendChat();
      const val = document.getElementById('chatInput').value;
      const list = document.getElementById('autocompleteList');
      list.innerHTML = '';
      
      if (!val || !val.startsWith('/')) {
        list.style.display = 'none';
        return;
      }

      const matches = commandList.filter(cmd => cmd.toLowerCase().includes(val.toLowerCase()));
      if (matches.length > 0) {
        matches.forEach(match => {
          const div = document.createElement('div');
          div.innerHTML = `<strong>${match.substring(0, val.length)}</strong>${match.substring(val.length)}`;
          div.onclick = () => {
            document.getElementById('chatInput').value = match;
            list.style.display = 'none';
            document.getElementById('chatInput').focus();
          };
          list.appendChild(div);
        });
        list.style.display = 'block';
      } else {
        list.style.display = 'none';
      }
    }

    // Socket Dinlemeleri
    socket.on('chat', (data) => {
      if (data.username === getActiveUsername()) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `chat-msg ${data.type === 'system' ? 'msg-system' : data.type === 'self' ? 'msg-self' : ''}`;
        div.textContent = `[${data.time}] ${data.text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }
    });

    socket.on('chatHistory', (data) => {
      if (data.username === getActiveUsername()) {
        const box = document.getElementById('chatBox');
        box.innerHTML = '';
        data.history.forEach(h => {
          const div = document.createElement('div');
          div.className = `chat-msg ${h.type === 'system' ? 'msg-system' : h.type === 'self' ? 'msg-self' : ''}`;
          div.textContent = `[${h.time}] ${h.text}`;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      }
    });

    socket.on('status', (data) => {
      if (data.username === getActiveUsername()) {
        const badge = document.getElementById('uiStatus');
        badge.textContent = data.status === 'online' ? 'Çevrimiçi' : data.status === 'connecting' ? 'Bağlanıyor...' : 'Çevrimdışı';
        badge.className = `status-badge ${data.status}`;
      }
    });

    socket.on('statsUpdate', (data) => {
      if (data.username === getActiveUsername()) {
        document.getElementById('uiHealth').textContent = data.health;
        document.getElementById('uiFood').textContent = data.food;
        document.getElementById('uiPos').textContent = `${data.pos.x}, ${data.pos.y}, ${data.pos.z}`;
      }
    });

    // Başlangıç Yüklemesi
    window.onload = () => {
      renderTabs();
      switchTab(0);
    };
  </script>
</body>
</html>
