<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft AFK Multi-Bot Portal - mc4fun</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; transition: all 0.2s ease; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: linear-gradient(135deg, #0f0c20 0%, #1a103c 100%); 
      color: #e2e8f0; 
      margin: 0; 
      padding: 20px; 
      min-height: 100vh;
    }
    .container { 
      max-width: 950px; 
      margin: 0 auto; 
      background: rgba(23, 15, 38, 0.85); 
      backdrop-filter: blur(12px);
      padding: 25px; 
      border-radius: 16px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }
    h2 { margin: 0; color: #a78bfa; font-weight: 700; font-size: 24px; }
    
    /* Sekme Yapısı */
    .bot-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: #8b5cf6;
      color: #fff;
      border-color: #a78bfa;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }
    .tab-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
    .tab-btn.online .tab-dot { background: #10b981; }

    .badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-online { background: rgba(52, 211, 153, 0.2); color: #34d399; border: 1px solid #34d399; }
    .badge-offline { background: rgba(248, 113, 113, 0.2); color: #f87171; border: 1px solid #f87171; }
    .badge-connecting { background: rgba(251, 191, 36, 0.2); color: #fbbf24; border: 1px solid #fbbf24; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

    .status-monitor {
      display: flex;
      gap: 15px;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 18px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .stat-item { display: flex; align-items: center; gap: 6px; }
    .stat-val { font-weight: 700; color: #38bdf8; }

    .config-panel { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 12px; 
      margin-bottom: 20px; 
      background: rgba(255, 255, 255, 0.03); 
      padding: 18px; 
      border-radius: 12px; 
      border: 1px solid rgba(255,255,255,0.05);
    }
    .input-field { display: flex; flex-direction: column; gap: 4px; }
    .input-field field-title { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }

    input[type="text"], input[type="password"], select { 
      padding: 10px 14px; 
      border-radius: 8px; 
      border: 1px solid rgba(255, 255, 255, 0.15); 
      background: rgba(15, 12, 32, 0.6); 
      color: #fff; 
      font-size: 14px;
      outline: none;
      width: 100%;
    }
    input:focus, select:focus { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167, 139, 250, 0.3); }
    
    .checkbox-group {
      grid-column: 1 / -1;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    label { font-size: 13px; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    
    .btn-group { grid-column: 1 / -1; display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
    button { 
      padding: 12px 18px; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-connect { background: #8b5cf6; color: #fff; flex: 2; }
    .btn-connect:hover { background: #7c3aed; }
    .btn-stop { background: #ef4444; color: #fff; flex: 1; }
    .btn-stop:hover { background: #dc2626; }
    .btn-reconnect { background: #f59e0b; color: #fff; flex: 1; }
    .btn-reconnect:hover { background: #d97706; }

    .quick-cmds {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    .quick-title { font-size: 12px; color: #94a3b8; font-weight: 600; margin-right: 5px; }
    .btn-cmd {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-cmd:hover { background: #a78bfa; color: #fff; }
    .btn-login { background: #3b82f6; color: #fff; font-weight: 700; }
    .btn-skyblock { background: #10b981; color: #fff; font-weight: 700; }

    /* GUI / Sandık Tasarımı */
    .gui-box {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #a78bfa;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      display: none;
    }
    .gui-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .gui-title { font-weight: 700; color: #fbbf24; font-size: 16px; }
    .btn-close-gui { background: #ef4444; color: #fff; padding: 4px 10px; font-size: 12px; }
    
    .chest-grid {
      display: grid;
      grid-template-columns: repeat(9, minmax(36px, 44px));
      gap: 4px;
      justify-content: center;
      background: #8b8b8b;
      padding: 8px;
      border-radius: 8px;
      border: 3px solid #373737;
    }
    .slot {
      width: 100%;
      aspect-ratio: 1;
      background: #c6c6c6;
      border: 2px solid #373737;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .slot:hover { background: #fff; border-color: #a78bfa; }
    .slot img { width: 28px; height: 28px; image-rendering: pixelated; pointer-events: none; }
    .slot-count {
      position: absolute;
      bottom: 1px;
      right: 3px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .mc-tooltip {
      display: none;
      position: fixed;
      z-index: 9999;
      background: rgba(16, 0, 16, 0.95);
      border: 2px solid #280068;
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12px;
      pointer-events: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.8);
      max-width: 280px;
      line-height: 1.4;
    }

    .chat-container { position: relative; }
    .chat-box-tab { 
      height: 350px; 
      overflow-y: auto; 
      background: #090613; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      padding: 15px; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      font-family: 'Fira Code', monospace; 
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .chat-msg { margin-bottom: 4px; word-break: break-word; }
    .system-msg { color: #38bdf8; font-weight: 600; }
    .clear-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .input-group { display: flex; gap: 10px; }
    .input-group input { flex: 1; }
    .btn-send { background: #a78bfa; color: #fff; padding: 0 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🎮 Minecraft AFK Portal</h2>
      <div id="statusBadge" class="badge badge-offline">
        <span class="dot"></span> <span id="statusText">Çevrimdışı</span>
      </div>
    </div>

    <!-- 5 Adet Bot Sekmesi -->
    <div class="bot-tabs">
      <button class="tab-btn active" id="tab-1" onclick="switchBot(1)"><span class="tab-dot"></span> Bot 1</button>
      <button class="tab-btn" id="tab-2" onclick="switchBot(2)"><span class="tab-dot"></span> Bot 2</button>
      <button class="tab-btn" id="tab-3" onclick="switchBot(3)"><span class="tab-dot"></span> Bot 3</button>
      <button class="tab-btn" id="tab-4" onclick="switchBot(4)"><span class="tab-dot"></span> Bot 4</button>
      <button class="tab-btn" id="tab-5" onclick="switchBot(5)"><span class="tab-dot"></span> Bot 5</button>
    </div>

    <div class="status-monitor">
      <div class="stat-item">❤️ Can: <span id="statHealth" class="stat-val">-</span></div>
      <div class="stat-item">🍗 Açlık: <span id="statFood" class="stat-val">-</span></div>
      <div class="stat-item">📍 Konum (X, Y, Z): <span id="statPos" class="stat-val">- / - / -</span></div>
    </div>
    
    <div class="config-panel">
      <div class="input-field">
        <field-title>Sunucu Adresi</field-title>
        <input type="text" id="host" value="play.mc4fun.net">
      </div>
      <div class="input-field">
        <field-title>Port</field-title>
        <input type="text" id="port" value="25565">
      </div>
      <div class="input-field">
        <field-title>Kullanıcı Adı</field-title>
        <input type="text" id="username" value="nusretyasir">
      </div>
      <div class="input-field">
        <field-title>Giriş Şifresi (/login)</field-title>
        <input type="password" id="password" value="">
      </div>
      <div class="input-field">
        <field-title>Komut Gecikmesi</field-title>
        <select id="cmdDelay">
          <option value="2000">2 Saniye Gecikme</option>
          <option value="3000" selected>3 Saniye Gecikme</option>
          <option value="5000">5 Saniye Gecikme</option>
        </select>
      </div>
      
      <div class="checkbox-group">
        <label><input type="checkbox" id="autoSkyblock"> Otomatik Skyblock'a Geç (/skyblock)</label>
        <label><input type="checkbox" id="autoReconnect" checked> Kopunca Otomatik Bağlan (10sn)</label>
      </div>

      <div class="btn-group">
        <button class="btn-connect" onclick="startBot()">⚡ Sunucuya Bağlan / Başlat</button>
        <button class="btn-stop" onclick="stopBot()">🛑 Oyundan Çıkar (Bağlantıyı Kes)</button>
        <button class="btn-reconnect" onclick="reconnectBot()">🔄 Yeniden Bağlan</button>
      </div>
    </div>

    <div class="quick-cmds">
      <span class="quick-title">Hızlı İşlemler:</span>
      <button class="btn-cmd btn-login" onclick="sendLogin()">🔑 Giriş Yap (/login)</button>
      <button class="btn-cmd btn-skyblock" onclick="sendCmd('/skyblock')">🏝️ /skyblock</button>
      <button class="btn-cmd" onclick="sendCmd('/shard')">💎 /shard</button>
      <button class="btn-cmd" onclick="sendCmd('/farm')">🌾 /farm</button>
      <button class="btn-cmd" onclick="sendCmd('/is')">🏠 /is (Ada)</button>
      <button class="btn-cmd" onclick="sendCmd('/afk')">💤 /afk</button>
      <button class="btn-cmd" onclick="sendCmd('/spawn')">📍 /spawn</button>
    </div>

    <!-- Sandık / GUI Arayüzü -->
    <div id="guiBox" class="gui-box">
      <div class="gui-header">
        <span id="guiTitle" class="gui-title">Açılan Menü</span>
        <button class="btn-close-gui" onclick="closeGui()">Kapat ✕</button>
      </div>
      <div id="chestGrid" class="chest-grid"></div>
    </div>

    <div class="chat-container">
      <button class="clear-btn" onclick="clearChat()">Sohbeti Temizle</button>
      <div id="chat-box" class="chat-box-tab"></div>
    </div>

    <div class="input-group">
      <input type="text" id="message" placeholder="Sohbete mesaj yazın..." onkeydown="handleKeyDown(event)">
      <button type="button" class="btn-send" id="sendBtn" onclick="sendMessage()">Gönder</button>
    </div>
  </div>

  <div id="mcTooltip" class="mc-tooltip"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentBotId = 1;
    
    // Her bot için hafızada veri tut
    const botData = {};
    for(let i = 1; i <= 5; i++) {
      botData[i] = {
        status: 'offline',
        stats: { health: '-', food: '-', pos: '- / - / -' },
        chatLogs: []
      };
    }

    function switchBot(botId) {
      currentBotId = botId;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx + 1) === botId);
      });

      // İlgili botun adını inputa otomatik aktar (seçilirse)
      const uInput = document.getElementById('username');
      if (uInput.value.startsWith('nusretyasir') || uInput.value.startsWith('bot_')) {
        uInput.value = botId === 1 ? 'nusretyasir' : `bot_${botId}`;
      }

      updateUI();
    }

    function updateUI() {
      const data = botData[currentBotId];
      const statusBadge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');

      if (data.status === 'online') {
        statusBadge.className = 'badge badge-online';
        statusText.innerText = 'Çevrimiçi (Oyunda)';
      } else if (data.status === 'connecting') {
        statusBadge.className = 'badge badge-connecting';
        statusText.innerText = 'Bağlanılıyor...';
      } else {
        statusBadge.className = 'badge badge-offline';
        statusText.innerText = 'Çevrimdışı';
      }

      document.getElementById('statHealth').innerText = data.stats.health;
      document.getElementById('statFood').innerText = data.stats.food;
      document.getElementById('statPos').innerText = data.stats.pos;

      // Sohbet geçmişini yükle
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';
      data.chatLogs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'chat-msg';
        if (msg.startsWith('[SİSTEM]')) div.classList.add('system-msg');
        div.textContent = msg;
        chatBox.appendChild(div);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    socket.on('status', (data) => {
      const { botId, status } = data;
      botData[botId].status = status;
      
      const tabEl = document.getElementById(`tab-${botId}`);
      if (tabEl) tabEl.classList.toggle('online', status === 'online');

      if (botId === currentBotId) updateUI();
    });

    socket.on('statsUpdate', (data) => {
      const { botId, health, food, pos } = data;
      botData[botId].stats = {
        health: health + ' / 20',
        food: food + ' / 20',
        pos: `${pos.x}, ${pos.y}, ${pos.z}`
      };
      if (botId === currentBotId) updateUI();
    });

    socket.on('chat', (data) => {
      const { botId, msg } = data;
      botData[botId].chatLogs.push(msg);
      if (botData[botId].chatLogs.length > 200) botData[botId].chatLogs.shift();

      if (botId === currentBotId) {
        const chatBox = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = 'chat-msg';
        if (msg.startsWith('[SİSTEM]')) div.classList.add('system-msg');
        div.textContent = msg;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    });

    socket.on('openWindow', (data) => {
      if (data.botId !== currentBotId) return;
      
      const guiBox = document.getElementById('guiBox');
      const guiTitle = document.getElementById('guiTitle');
      const chestGrid = document.getElementById('chestGrid');
      const mcTooltip = document.getElementById('mcTooltip');

      guiTitle.innerText = data.title || 'Açılan Menü';
      chestGrid.innerHTML = '';
      guiBox.style.display = 'block';

      data.slots.forEach((item) => {
        const slotEl = document.createElement('div');
        slotEl.className = 'slot';

        if (!item.empty && item.name) {
          const imgUrl = `https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/${item.name}.png`;
          
          slotEl.innerHTML = `
            <img src="${imgUrl}" onerror="this.src='https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/${item.name}.png'">
            ${item.count > 1 ? `<span class="slot-count">${item.count}</span>` : ''}
          `;

          slotEl.onmousemove = (e) => {
            let html = `<b style="color:#fbbf24">${item.displayName}</b>`;
            if (item.lore && item.lore.length > 0) {
              html += `<br><span style="color:#cbd5e1">${item.lore.join('<br>')}</span>`;
            }
            mcTooltip.innerHTML = html;
            mcTooltip.style.display = 'block';
            mcTooltip.style.left = (e.clientX + 14) + 'px';
            mcTooltip.style.top = (e.clientY + 14) + 'px';
          };

          slotEl.onmouseleave = () => {
            mcTooltip.style.display = 'none';
          };
        }

        slotEl.onclick = () => {
          socket.emit('clickSlot', { botId: currentBotId, slotIndex: item.slot });
        };

        chestGrid.appendChild(slotEl);
      });
    });

    socket.on('closeWindow', (data) => {
      if (data.botId === currentBotId) {
        document.getElementById('guiBox').style.display = 'none';
        document.getElementById('mcTooltip').style.display = 'none';
      }
    });

    function startBot() {
      const host = document.getElementById('host').value;
      const port = document.getElementById('port').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const autoSkyblock = document.getElementById('autoSkyblock').checked;
      const autoReconnect = document.getElementById('autoReconnect').checked;
      const cmdDelay = document.getElementById('cmdDelay').value;

      socket.emit('startBot', { botId: currentBotId, host, port, username, password, autoSkyblock, autoReconnect, cmdDelay });
    }

    function stopBot() {
      socket.emit('stopBot', currentBotId);
    }

    function reconnectBot() {
      socket.emit('reconnectBot', currentBotId);
    }

    function sendLogin() {
      const password = document.getElementById('password').value;
      socket.emit('sendLogin', { botId: currentBotId, password });
    }

    function sendCmd(cmd) {
      socket.emit('sendCmd', { botId: currentBotId, cmd });
    }

    function sendMessage() {
      const input = document.getElementById('message');
      if (!input) return;
      const text = input.value.trim();
      if (text !== '') {
        socket.emit('sendMessage', { botId: currentBotId, msg: text });
        input.value = '';
      }
    }

    function handleKeyDown(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    }

    function closeGui() {
      document.getElementById('guiBox').style.display = 'none';
      document.getElementById('mcTooltip').style.display = 'none';
      socket.emit('closeCurrentWindow', currentBotId);
    }

    function clearChat() {
      botData[currentBotId].chatLogs = [];
      updateUI();
    }
  </script>
</body>
</html>
